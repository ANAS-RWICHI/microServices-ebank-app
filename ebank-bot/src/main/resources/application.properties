spring.application.name=ebank-bot
server.port=8058
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=${MODEL:gemini-2.5-flash}
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8088/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8057/mcp

discord.token=${DISCORD_TOKEN}

discord.gateway-intents=MESSAGE_CONTENT
discord.event-passthrough=false