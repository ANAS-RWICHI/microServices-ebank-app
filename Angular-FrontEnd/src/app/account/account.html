<div class="p-3">
  @if (account$ | async; as accountList) {
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th class="text-end">Balance</th>
            <th>Date</th>
            <th>Type</th>
            <th>Customer ID</th>
          </tr>
        </thead>
        <tbody>
          @for (acc of accountList; track acc.id) {
            <tr>
              <td>{{ acc.id }}</td>
              <td class="text-end">{{ acc.balance }}</td>
              <td>{{ acc.createdAt | date }}</td>
              <td>{{ acc.type }}</td>
              <td>{{ acc.customerId }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
